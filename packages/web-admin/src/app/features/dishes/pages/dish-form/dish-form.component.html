<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link" aria-label="Volver al listado de platos">
        <lucide-icon name="chevron-left" [size]="18" aria-hidden="true"></lucide-icon>
      </a>
      <h1 id="dish-form-title">{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error" role="alert">{{ error() }}</div>
  }

  <form class="card form-card" aria-labelledby="dish-form-title" [attr.aria-busy]="loading()" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label for="dish-name">Nombre del plato</label>
        <input id="dish-name" type="text" required aria-required="true" class="form-control" [(ngModel)]="form.name" name="name" placeholder="Ensalada César" />
      </div>

      <div class="form-group">
        <label for="dish-price">Precio (€)</label>
        <input id="dish-price" type="number" min="0" step="0.01" required aria-required="true" class="form-control" [(ngModel)]="form.price" name="price" />
      </div>

      <div class="form-group">
        <label for="dish-category">Categoría</label>
        <select id="dish-category" class="form-control" [(ngModel)]="form.category" name="category">
          @for (c of categories; track c) {
            <option [value]="c">{{ getCategoryLabel(c) }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="dish-available">Disponible</label>
        <select id="dish-available" class="form-control" [(ngModel)]="form.available" name="available">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group form-full">
        <label for="dish-description">Descripción (opcional)</label>
        <textarea id="dish-description" class="form-control" [(ngModel)]="form.description" name="description" rows="3" placeholder="Una deliciosa ensalada con..."></textarea>
      </div>
    </div>

    <section class="ingredients-section" aria-labelledby="ingredients-title">
      <h3 id="ingredients-title">Ingredientes del plato</h3>

      @if (form.ingredients.length > 0) {
        <ul class="ingredient-chips" aria-label="Ingredientes añadidos">
          @for (ing of form.ingredients; track ing.ingredientId) {
            <li class="ingredient-chip">
              <span>{{ getIngredientName(ing.ingredientId) }} — {{ ing.quantity }}</span>
              <button type="button" class="chip-remove" (click)="removeIngredient(ing.ingredientId)"
                [attr.aria-label]="'Quitar ' + getIngredientName(ing.ingredientId)">
                <lucide-icon name="trash-2" [size]="12" aria-hidden="true"></lucide-icon>
              </button>
            </li>
          }
        </ul>
      }

      <div class="add-ingredient-row">
        <select class="form-control" aria-label="Ingrediente a añadir" [(ngModel)]="newIngredientId" name="newIngredientId">
          <option value="">Seleccionar ingrediente</option>
          @for (i of ingredientStore.ingredients(); track i.id) {
            <option [value]="i.id">{{ i.name }} ({{ i.unit }})</option>
          }
        </select>
        <input type="number" min="0" class="form-control qty-input" aria-label="Cantidad del ingrediente" [(ngModel)]="newIngredientQty" name="newIngredientQty" placeholder="Cant."
          (keydown.enter)="$event.preventDefault(); addIngredient()" />
        <button type="button" class="btn btn-secondary btn-sm" (click)="addIngredient()" aria-label="Añadir ingrediente">
          <lucide-icon name="plus" [size]="14" aria-hidden="true"></lucide-icon>
        </button>
      </div>
    </section>

    <div class="form-actions">
      <a class="btn btn-secondary" [routerLink]="listUrl">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
